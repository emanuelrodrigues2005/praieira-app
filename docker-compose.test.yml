services:
  postgres_reviews_test:
    image: postgres:15-alpine
    container_name: postgres_reviews_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_reviews_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_reviews_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  rabbitmq_test:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_test
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mongo_analytics_test:
    image: mongo:7.0
    container_name: mongo_analytics_test
    environment:
      MONGO_INITDB_DATABASE: db_analytics_test
    ports:
      - "27018:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
