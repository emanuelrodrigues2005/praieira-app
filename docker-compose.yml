services:
  # ========== INFRA ==========
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub_network

  postgres_db:
    image: postgis/postgis:15-3.3-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub_network

  mongo_db:
    image: mongo:7.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: db_analytics
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hub_network

  # ========== MICROSSERVIÇOS ==========
  service-auth:
    build:
      context: ./service-auth
      dockerfile: Dockerfile
    container_name: service-auth
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: "postgresql://postgres:postgres@postgres_db:5432/db_auth?schema=public"
      RMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hub_network

  service-catalog:
    build:
      context: ./service-catalog
      dockerfile: Dockerfile
    container_name: service-catalog
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: "3002"
      DATABASE_URL: "postgresql://postgres:postgres@postgres_db:5432/db_catalog?schema=public"
      RMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      RMQ_EXCHANGE: "praieira.events"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      JWT_ALGORITHM: "HS256"
      CORS_ORIGIN: "http://localhost:4200"
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hub_network

  service-reviews:
    build:
      context: ./service-reviews
      dockerfile: Dockerfile
    container_name: service-reviews
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: "3003"
      DATABASE_URL: "postgresql://postgres:postgres@postgres_db:5432/db_reviews?schema=public"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      JWT_ALGORITHM: "HS256"
      RMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      RMQ_EXCHANGE: "praieira.events"
      CATALOG_MODE: "stub"
      STUB_WORKER_PROFILE_ID: "10000000-0000-4000-8000-000000000001"
      STUB_WORKER_PROFILE_STATUS: "APPROVED"
      STUB_WORKER_PROFILE_ACTIVE: "true"
      STUB_WORKER_WHATSAPP: "5581999999999"
      STUB_WORKER_PHONE: "5581812345678"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "20"
      OUTBOX_MAX_ATTEMPTS: "10"
      OUTBOX_RETRY_BASE_DELAY_MS: "2000"
      OUTBOX_LEASE_TIMEOUT_MS: "30000"
      REVIEW_COMMENT_MAX_LENGTH: "1000"
      REVIEW_EDIT_WINDOW_HOURS: "24"
      CORS_ORIGIN: "http://localhost:4200"
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hub_network

  service-curation:
    build:
      context: ./service-curation
      dockerfile: Dockerfile
    container_name: service-curation
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: "3004"
      DATABASE_URL: "postgresql://postgres:postgres@postgres_db:5432/db_curation?schema=public"
      RMQ_URL: "amqp://guest:guest@rabbitmq:5672"
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hub_network

  service-analytics:
    build:
      context: ./service-analytics
      dockerfile: Dockerfile
    container_name: service-analytics
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      PORT: "3005"
      MONGO_URL: "mongodb://mongo_db:27017/db_analytics"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      JWT_ALGORITHM: "HS256"
      RMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      RMQ_EXCHANGE: "praieira.events"
      RMQ_QUEUE: "analytics.events"
      RMQ_RETRY_EXCHANGE: "praieira.retry"
      RMQ_RETRY_QUEUE: "analytics.events.retry"
      RMQ_DLX: "praieira.dlx"
      RMQ_DLQ: "analytics.events.dlq"
      MAX_RETRY_ATTEMPTS: "3"
      RETRY_DELAY_MS: "2000"
      CORS_ORIGIN: "http://localhost:4200"
      CATALOG_URL: "http://service-catalog:3002"
    depends_on:
      mongo_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hub_network

  # ========== FRONTEND ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:4200"
    depends_on:
      - service-auth
      - service-catalog
      - service-reviews
      - service-curation
      - service-analytics
    networks:
      - hub_network

volumes:
  pgdata:
  mongodata:

networks:
  hub_network:
    driver: bridge
